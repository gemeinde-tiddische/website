# Weiterleitungen von alten Adressen auf neue
#
# GitHub Pages kennt keine Weiterleitungen auf dem Server. Wer eine
# dieser alten Adressen aufruft, landet auf der Fehlerseite (404) und
# wird von dort sofort zur neuen Adresse weitergeleitet.
#
# Neue Weiterleitung: eine Zeile ergänzen –  "/alte/adresse": /neue/adresse/
# Alte Vereins-Unterseiten (/verein1t.html usw.) führen automatisch
# zur Vereinsübersicht (siehe layouts/404.html).
# ─────────────────────────────────────────────

