# ─────────────────────────────────────────────────────────────
# Netlify-Konfiguration · Gemeinde Tiddische
# Die Hugo-Version ist absichtlich festgepinnt, damit der Build
# auch in Jahren noch identisch funktioniert. Zum Aktualisieren:
# siehe EINRICHTUNG.md → "Hugo aktualisieren".
# ─────────────────────────────────────────────────────────────

[build]
  publish = "public"
  command = "hugo --gc --minify"

[build.environment]
  HUGO_VERSION = "0.147.9"
  TZ = "Europe/Berlin"

[context.deploy-preview]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

# ── Weiterleitungen von den alten URLs (Stand: alte Website 2026) ──

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

