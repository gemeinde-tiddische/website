{{ define "main" }}
<div class="inhalt inhalt-schmal">
  <header class="seitenkopf"><h1>{{ .Title }}</h1>
  <p class="artikel-meta">Sitzung vom {{ partial "datum.html" .Date }}</p></header>
  <div class="prosa">{{ .Content }}</div>
  <ul class="pdf-liste">{{ partial "pdf-link.html" (dict "pfad" .Params.pdf "titel" .Title) }}</ul>
  <p><a href="/protokolle/">← Alle Protokolle</a></p>
</div>
{{ end }}
